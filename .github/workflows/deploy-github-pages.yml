# Coloca o resultado de `vite build` (pasta dist/) no branch **gh-pages**.
#
# No GitHub: Settings → Pages → Build and deployment → **Deploy from a branch**
#            Branch: **gh-pages**  |  Folder: **/ (root)**
#
# Se deixares **main** + **/ (root)**, o Pages serve o index.html de desenvolvimento
# (com `<script src="/src/main.tsx">`) → 404 em produção.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir base path (Pages)
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "Site user/org na raiz — base=/"
          else
            echo "VITE_BASE_PATH=/${REPO_NAME}/" >> "$GITHUB_ENV"
            echo "Site de projeto — base=/${REPO_NAME}/"
          fi

      - name: Build (homologação + sync docs)
        run: npm run build:homolog

      - name: Fallback SPA + .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Push dist → branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
